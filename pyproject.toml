[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specimen"
version = "1.1.0"
description = "Sample-to-story malware analysis pipeline: explainable static gate, CAPE/trace replay into a provenance graph, family attribution, and specificity-checked YARA + Sigma synthesis (lab-only, never executes samples)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.5", "lightgbm>=4.6", "matplotlib>=3.8"]
dev = ["pytest>=7", "ruff==0.16.10"]

[project.scripts]
specimen = "specimen.cli:main"

[tool.setuptools.packages.find]
include = ["specimen*"]

[tool.setuptools.package-data]
specimen = ["data/*.json", "data/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "realdata: needs the downloaded public datasets (SPECIMEN_DATA); skipped otherwise",
    "ml: needs the optional [ml] dependencies",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["E402"]
# payload() is always fully consumed before the loop advances
"specimen/datasets.py" = ["B023"]
