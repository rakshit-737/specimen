name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    name: core (stdlib only) - py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m specimen demo --out out
      - run: python -m specimen report tests/fixtures/cape/avast_lokibot_1.json
  ml-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ml]"
      - run: python -m ruff check .
      - run: python -m pytest -q -m "not realdata"
