name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    # read-only: tests, version guard, wheel/sdist, notes; third-party code runs here without write tokens
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          v="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME#v}" = "$v"
      - name: Lint and full test suite
        run: |
          pip install -e ".[dev,ml]"
          python -m ruff check .
          python -m pytest -q
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" 'index($0, "## [" v "]")==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            notes.md
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read  # fetch_models.py may read the bench artefact that produced the models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Version without the leading v
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned model files (SHA-256 verified against scripts/model_assets.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_models.py --dest release-models
      - name: Add the model SHA-256s to the release notes
        run: |
          {
            echo
            echo "### Model assets"
            echo
            echo "Trained models attached to this release (pinned in \`scripts/model_assets.json\`):"
            echo
            echo "| file | SHA-256 |"
            echo "|---|---|"
            for f in release-models/*; do echo "| \`$(basename "$f")\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } >> notes.md
          cat notes.md
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image and run it before pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: specimen:release
      - run: docker run --rm --network none -v "$PWD/tests/fixtures:/fx:ro" specimen:release report /fx/cape/avast_njrat_1.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rakshit-737/specimen:${{ github.ref_name }}
            ghcr.io/rakshit-737/specimen:${{ steps.ver.outputs.v }}
            ghcr.io/rakshit-737/specimen:latest
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* release-models/* --title "SPECIMEN $GITHUB_REF_NAME" --notes-file notes.md
