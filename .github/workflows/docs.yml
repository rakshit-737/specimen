name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e . -r docs/requirements.txt
      - name: Regenerate the demo pages (family model from the latest release's assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install numpy scipy scikit-learn
          gh release download -R "$GITHUB_REPOSITORY" -p 'family_*' -D models || echo "no release model assets"
          python scripts/build_demo.py
          git diff --stat -- docs/demo
      - run: mkdocs build --strict
      - name: Check that every <img src> in the built site resolves
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          from urllib.parse import urljoin
          site = Path("site").resolve()
          bad = []
          for page in site.rglob("*.html"):
              rel = page.relative_to(site).as_posix()
              base = "/" + rel
              for src in re.findall(r'<img[^>]+src="([^"]+)"', page.read_text(encoding="utf-8")):
                  if src.startswith(("http:", "https:", "data:", "//")):
                      continue
                  target = urljoin(base, src.split("#")[0].split("?")[0]).lstrip("/")
                  if not (site / target).is_file():
                      bad.append(f"{rel}: {src}")
          print(chr(10).join(bad) or "all images resolve")
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
